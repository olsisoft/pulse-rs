name: Release to crates.io

# Lives at .github/workflows/release.yaml in olsisoft/pulse-rs.
# Triggered by tag push (v*). Runs tests then publishes the crate.
#
# Authentication: crates.io Trusted Publishing (OIDC) via
# rust-lang/crates-io-auth-action. Publisher configured on crates.io for
# olsisoft/pulse-rs, workflow release.yaml, environment crates-io.
# No long-lived CARGO_REGISTRY_TOKEN secret is used by this workflow.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # for GitHub Release creation
  id-token: write   # required for crates.io Trusted Publishing (OIDC token exchange)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: crates-io   # configure in repo settings → environments
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.toml') }}

      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version=$(grep -E '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag ($tag_version) does not match Cargo.toml version ($crate_version)"
            exit 1
          fi

      - name: Run tests
        run: cargo test --verbose

      - name: Dry-run publish (catches packaging issues early)
        run: cargo publish --dry-run

      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Install: `cargo add pulse-client@${{ github.ref_name }}`
